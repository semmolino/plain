name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"

# Concurrency-Gruppe pro Commit (SHA), NICHT pro Ref, und ohne
# cancel-in-progress. Hintergrund: GitHub feuert fuer einen einzelnen Push
# gelegentlich zwei identische Runs (Sekunden auseinander). Mit
# "cancel-in-progress: true" + ref-Gruppe cancelt der zweite Run den ersten —
# der Commit hat dann eine ABGEBROCHENE Check-Suite neben der erfolgreichen.
# Railway ("wait for CI") wertet die abgebrochene Suite als Fehlschlag und
# deployt nicht. Pro-SHA-Gruppe + kein Cancel => jeder Commit bekommt eine
# eindeutig gruene Suite; doppelte Runs desselben Commits laufen seriell.
concurrency:
  group: tests-${{ github.sha }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix backend

      - name: Run tests
        run: npm test --prefix backend -- --no-coverage --ci
        env:
          JWT_SECRET: test-secret-ci

  security:
    name: Sicherheitsscan
    runs-on: ubuntu-latest

    # Prueft die QUELLE gegen scripts/security-baseline.json: fehlschlagen laesst
    # nur NEUES. Der bekannte Bestand steht in docs/SECURITY_AUDIT_2026-09-03.md
    # und soll schrumpfen — waechst die Baseline, gehoert eine Begruendung in den
    # Commit. Konzept: docs/SECURITY_AUDIT_CONCEPT.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Bei Push/PR ohne --deps: schnell, kein Netz noetig, keine Abhaengigkeit
      # von der Tagesform der Advisory-Datenbank.
      - name: Quellcode-Scan
        run: node scripts/security-scan.mjs

      # Im naechtlichen Lauf zusaetzlich npm audit. Hohe Funde werden gezeigt,
      # scheitern lassen nur kritische — sonst faerbt ein Advisory in einer
      # Entwicklungsabhaengigkeit jeden Commit rot.
      - name: Abhaengigkeiten pruefen
        if: github.event_name == 'schedule'
        run: |
          npm ci --prefix backend --ignore-scripts
          npm ci --prefix frontend-react --ignore-scripts
          node scripts/security-scan.mjs --deps

  frontend-typecheck:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend-react

      - name: Type check
        run: cd frontend-react && npx tsc -b

      # Findet im Code benutzte CSS-Variablen und Klassen, die es nirgends
      # gibt, sowie Kontraste unter WCAG AA. Solche Fehler verschwinden im
      # Browser lautlos — der Design-Audit vom August 2026 hat rund 20 davon
      # gefunden (u. a. Fehlermeldungen, die nicht rot waren).
      - name: Design-System pruefen
        run: cd frontend-react && npm run check:design

  frontend-unit:
    name: Frontend Unit (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend-react

      - name: Run unit tests
        run: cd frontend-react && npx vitest run

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend-react

      - name: Install Playwright Chromium
        run: cd frontend-react && npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: cd frontend-react && npx playwright test --project=desktop --project=mobile
        env:
          CI: true

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-react/playwright-report/
          retention-days: 7
